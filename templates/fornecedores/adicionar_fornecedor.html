{% extends 'base.html' %}

{% block title %}
    Fornecedor - {{ block.super }}
{% endblock title %}

{% block body %}

{% if form.instance.pk %}
    <h2>Editar Fornecedor</h2>
{% else %}
    <h2>Cadastro de Fornecedor</h2>
{% endif %}

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Salvar</button>
</form>

{% endblock body %}
