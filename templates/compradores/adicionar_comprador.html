
{% extends 'base.html' %}

{% block title %}
    Cadastro de Compradores - {{ block.super }}
{% endblock title %}

{% block body %}
<h2>Cadastro de Compradores</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Salvar</button>
    <a href="{% url 'compradores:listar_compradores' %}">
        Cancelar
    </a>
</form>
{% endblock body %}
