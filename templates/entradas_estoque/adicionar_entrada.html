{% extends 'base.html' %}

{% block title %}
    Registrar Entrada - {{ block.super }}
{% endblock title %}

{% block body %}

<h2>Registrar Entrada de Estoque</h2>

<form method="POST">
    {% csrf_token %}
    <input type="hidden" name="idempotency_token" value="{{ idempotency_token }}">

    {{ form.non_field_errors }}
    {{ form.as_p }}

    <button type="submit">Registrar Entrada</button>
</form>

<a href="{% url 'entradas_estoque:listar_entradas' %}">Cancelar</a>

{% endblock body %}
